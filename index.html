<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Desi Calculator - SIP FD RD</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2144399963616374" crossorigin="anonymous"></script>
<style>body{font-family:Arial;background:#f2f2f2;margin:0}header{background:#0b5e2e;color:#fff;text-align:center;padding:15px}.wrap{max-width:600px;margin:auto;padding:10px}.menu{text-align:center;background:#fff;padding:10px;border-radius:10px}.menu a{margin:0 10px;text-decoration:none;font-weight:bold;color:#0b5e2e}.ads{background:#fff;text-align:center;padding:10px;margin:10px 0;border:1px dashed #999}.card{background:#fff;padding:15px;border-radius:10px;margin:10px 0}.box{margin:10px 0}.box label{font-weight:bold}input{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:5px}button{background:#ff7a00;color:#fff;border:0;padding:12px;width:100%;border-radius:8px;font-size:16px;font-weight:bold}h2{margin:0 0 10px}</style>
</head><body>
<header><h1>🇮🇳 Desi Calculator</h1><p>Sab Calculator Ek Jagah</p></header>
<div class="wrap">
<div class="menu"><a href="#sip">💰 SIP</a><a href="#fd">🏦 FD</a><a href="#rd">📈 RD</a></div>
<div class="ads">ADVERTISEMENT</div>

<div class="card" id="sip"><h2>💰 SIP Calculator</h2>
<div class="box"><label>BOX 1 - Monthly Paisa</label><input id="s1" type="number" placeholder="Ex: 2000"></div>
<div class="box"><label>BOX 2 - Return %</label><input id="s2" type="number" placeholder="Ex: 12"></div>
<div class="box"><label>BOX 3 - Kitne Saal</label><input id="s3" type="number" placeholder="Ex: 10"></div>
<button onclick="csip()">👉 SIP NIKALO</button><p id="sr"></p></div>

<div class="card" id="fd"><h2>🏦 FD Calculator</h2>
<div class="box"><label>BOX 1 - Kitna Paisa</label><input id="f1" type="number" placeholder="Ex: 100000"></div>
<div class="box"><label>BOX 2 - Interest %</label><input id="f2" type="number" placeholder="Ex: 7"></div>
<div class="box"><label>BOX 3 - Kitne Saal</label><input id="f3" type="number" placeholder="Ex: 5"></div>
<button onclick="cfd()">👉 FD NIKALO</button><p id="fr"></p></div>

<div class="card" id="rd"><h2>📈 RD Calculator</h2>
<div class="box"><label>BOX 1 - Monthly Paisa</label><input id="r1" type="number" placeholder="Ex: 5000"></div>
<div class="box"><label>BOX 2 - Interest %</label><input id="r2" type="number" placeholder="Ex: 6.5"></div>
<div class="box"><label>BOX 3 - Kitne Saal</label><input id="r3" type="number" placeholder="Ex: 3"></div>
<button onclick="crd()">👉 RD NIKALO</button><p id="rr"></p></div>

</div>
<script>
function csip(){let m=+document.getElementById('s1').value,r=+document.getElementById('s2').value/100/12,n=+document.getElementById('s3').value*12;let f=m*((Math.pow(1+r,n)-1)/r)*(1+r);document.getElementById('sr').innerHTML="Total: ₹"+Math.round(f).toLocaleString('en-IN')}
function cfd(){let p=+document.getElementById('f1').value,r=+document.getElementById('f2').value/100,t=+document.getElementById('f3').value;let f=p*Math.pow(1+r,t);document.getElementById('fr').innerHTML="Total: ₹"+Math.round(f).toLocaleString('en-IN')}
function crd(){let m=+document.getElementById('r1').value,r=+document.getElementById('r2').value/100/12,n=+document.getElementById('r3').value*12;let f=m*((Math.pow(1+r,n)-1)/r)*(1+r);document.getElementById('rr').innerHTML="Total: ₹"+Math.round(f).toLocaleString('en-IN')}
</script>
</body></html>
