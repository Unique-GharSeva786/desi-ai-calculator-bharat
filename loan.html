<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loan EMI</title><style>body{font-family:Arial;background:#f1f2f6;padding:12px}label{font-weight:bold;display:block;margin-top:10px}input{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}button{width:100%;padding:13px;background:#ff6a00;color:#fff;border:0;border-radius:10px;font-weight:bold;margin-top:12px}.card{background:#fff;padding:18px;border-radius:16px}.res{background:#e8ffe8;padding:12px;border-radius:10px;margin-top:10px;font-weight:bold;text-align:center}.ads{background:#fff;border:2px dashed #ccc;border-radius:14px;padding:18px;text-align:center;color:#888;margin:14px 0}.back{display:block;background:#111;color:#fff;text-align:center;padding:13px;border-radius:14px;text-decoration:none}</style></head><body>
<a href="index.html">← Back</a><div class="ads">📢 Yaha Ads Aayega</div>
<div class="card"><h2>🏠 Loan / EMI Calculator</h2>
<label>💰 Loan Kitna Liya? (Amount)</label><input id="a" type="number" value="500000">
<label>📊 Byaj Kitna % ? (Interest Rate)</label><input id="b" type="number" value="9">
<label>📅 Kitne Mahine Ke Liye? (Months)</label><input id="c" type="number" value="60">
<button onclick="calc()">Calculate</button><div class="res" id="r">Result yaha aayega</div></div>
<div class="ads">📢 Yaha Ads Aayega</div><a class="back" href="index.html">← Sab Calculator Dekho</a>
<script>function calc(){let p=+a.value,rt=+b.value/100/12,n=+c.value;let emi=p*rt*Math.pow(1+rt,n)/(Math.pow(1+rt,n)-1);r.innerText="EMI: ₹"+Math.round(emi).toLocaleString('en-IN')+" / mahina"}</script></body></html>
