<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FD</title><style>body{font-family:Arial;background:#f1f2f6;padding:12px}label{font-weight:bold;display:block;margin-top:10px}input{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}button{width:100%;padding:13px;background:#ff6a00;color:#fff;border:0;border-radius:10px;font-weight:bold;margin-top:12px}.card{background:#fff;padding:18px;border-radius:16px}.res{background:#e8ffe8;padding:12px;border-radius:10px;margin-top:10px;font-weight:bold;text-align:center}.ads{background:#fff;border:2px dashed #ccc;border-radius:14px;padding:18px;text-align:center;color:#888;margin:14px 0}.back{display:block;background:#111;color:#fff;text-align:center;padding:13px;border-radius:14px;text-decoration:none}</style></head><body>
<a href="index.html">← Back</a><div class="ads">📢 Yaha Ads Aayega</div>
<div class="card"><h2>🏦 FD Calculator</h2>
<label>💰 Kitna Paisa Jama Karna Hai?</label><input id="a" type="number" value="100000">
<label>📊 Bank Byaj Kitna % De Raha Hai?</label><input id="b" type="number" value="7">
<label>📅 Kitne Saal Ke Liye? (Years)</label><input id="c" type="number" value="5">
<button onclick="calc()">Calculate</button><div class="res" id="r">Result yaha aayega</div></div>
<div class="ads">📢 Yaha Ads Aayega</div><a class="back" href="index.html">← Sab Calculator Dekho</a>
<script>function calc(){let m=+a.value*Math.pow(1+(+b.value/100),+c.value);r.innerText="Maturity: ₹"+Math.round(m).toLocaleString('en-IN')}</script></body></html>
