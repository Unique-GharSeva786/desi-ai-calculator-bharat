<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FD Calculator - Desi AI Calculator</title>
<style>body{font-family:Arial;background:#f5f5f5;padding:15px} .box{background:#fff;padding:20px;border-radius:15px;max-width:500px;margin:auto} input{width:100%} button{width:100%;padding:12px;background:#0f9d58;color:#fff;border:none;border-radius:10px;font-size:17px}</style></head>
<body><div class="box"><h2 style="text-align:center">🏦 FD Calculator</h2>
<p>Kitna Jama Karoge: <b id="a1">100000</b></p><input type="range" id="a" min="10000" max="1000000" step="10000" value="100000" oninput="c()">
<p>Interest Rate: <b id="b1">7%</b></p><input type="range" id="b" min="1" max="12" step="0.1" value="7" oninput="c()">
<p>Time: <b id="c1">5 Saal</b></p><input type="range" id="c" min="1" max="10" value="5" oninput="c()">
<div style="background:#e6f4ea;padding:12px;border-radius:10px;text-align:center;margin-top:12px"><p>Invested: <b id="inv"></b></p><p>Interest: <b id="gain"></b></p><h3>Total: <b id="tot"></b></h3></div>
<button onclick="c()">Calculate Karo</button>
<p style="text-align:center"><a href="index.html">⬅ Back to Home</a></p>
</div><script>
function c(){let P=+document.getElementById('a').value;let r=+document.getElementById('b').value/100;let t=+document.getElementById('c').value;document.getElementById('a1').innerText=P.toLocaleString('en-IN');document.getElementById('b1').innerText=document.getElementById('b').value+"%";document.getElementById('c1').innerText=t+" Saal";let FV=P*Math.pow(1+r/4,4*t);document.getElementById('inv').innerText="₹"+P.toLocaleString('en-IN');document.getElementById('gain').innerText="₹"+Math.round(FV-P).toLocaleString('en-IN');document.getElementById('tot').innerText="₹"+Math.round(FV).toLocaleString('en-IN');}c();
</script></body></html>
