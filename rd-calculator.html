<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RD Calculator - Desi AI Calculator</title>
<style>body{font-family:Arial;background:#f5f5f5;padding:15px} .box{background:#fff;padding:20px;border-radius:15px;max-width:500px;margin:auto} input{width:100%} button{width:100%;padding:12px;background:#ff6d00;color:#fff;border:none;border-radius:10px;font-size:17px}</style></head>
<body><div class="box"><h2 style="text-align:center">📈 RD Calculator</h2>
<p>Har Mahine: <b id="a1">5000</b></p><input type="range" id="a" min="500" max="50000" step="500" value="5000" oninput="c()">
<p>Interest Rate: <b id="b1">6.5%</b></p><input type="range" id="b" min="1" max="12" step="0.1" value="6.5" oninput="c()">
<p>Time: <b id="c1">5 Saal</b></p><input type="range" id="c" min="1" max="10" value="5" oninput="c()">
<div style="background:#fff3e0;padding:12px;border-radius:10px;text-align:center;margin-top:12px"><p>Invested: <b id="inv"></b></p><p>Interest: <b id="gain"></b></p><h3>Total: <b id="tot"></b></h3></div>
<button onclick="c()">Calculate Karo</button>
<p style="text-align:center"><a href="index.html">⬅ Back to Home</a></p>
</div><script>
function c(){let P=+document.getElementById('a').value;let r=+document.getElementById('b').value/100/4;let n=+document.getElementById('c').value*4;document.getElementById('a1').innerText=P.toLocaleString('en-IN');document.getElementById('b1').innerText=document.getElementById('b').value+"%";document.getElementById('c1').innerText=document.getElementById('c').value+" Saal";let FV=P*((Math.pow(1+r,n)-1)/(1-Math.pow(1+r,-1/3)));let inv=P*document.getElementById('c').value*12;document.getElementById('inv').innerText="₹"+inv.toLocaleString('en-IN');document.getElementById('gain').innerText="₹"+Math.round(FV-inv).toLocaleString('en-IN');document.getElementById('tot').innerText="₹"+Math.round(FV).toLocaleString('en-IN');}c();
</script></body></html>
